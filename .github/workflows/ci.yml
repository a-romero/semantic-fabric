name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./client
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Contract tests
        run: pytest -q

      - name: Verify EvidenceUnit schema snapshot is in sync
        run: |
          python -c "import json; from fabric_client.models import EvidenceUnit; print(json.dumps(EvidenceUnit.model_json_schema(), indent=2))" > /tmp/schema.json
          diff -u contracts/evidence_unit.schema.json /tmp/schema.json \
            || (echo '::error::contracts/evidence_unit.schema.json is stale — run `make contracts` and commit.' && exit 1)
