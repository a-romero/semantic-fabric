[project]
name = "semantic-fabric"
version = "0.1.0"
description = "Enterprise semantic layer: ingestion, Context Graph, retrieval, reasoning, provenance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fabric-client",          # contract types (path dep in dev, see [tool.uv.sources])
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    # Phase 1 retrieval runs on pure-Python defaults (hashing embedder + in-memory
    # vector store + built-in BM25) — no extra deps. The production backends below
    # are optional and selected by config.
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
# Production retrieval backends (Qdrant vector store + BGE-M3 embeddings).
prod = ["qdrant-client>=1.9", "FlagEmbedding>=1.2"]
# Semantic layers adopted per ADR 0001 (provenance / reasoning / ontology).
# Pinned per the evaluation spike; 0.x churn + bus-factor make drift a real risk.
semantica = ["semantica==0.6.8"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.uv.sources]
fabric-client = { path = "client", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "ingest", "retrieval", "graph", "kb", "reasoning", "provenance", "ontology"]

[tool.pytest.ini_options]
pythonpath = ["client", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
