[project]
name = "semantic-fabric"
version = "0.1.0"
description = "Enterprise semantic layer: ingestion, Context Graph, retrieval, reasoning, provenance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fabric-client",          # contract types (path dep in dev, see [tool.uv.sources])
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    # heavy semantica-side deps (semantica, vector store, graph store, VLM) are
    # added per phase; Phase 0 runs on stubs only.
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.uv.sources]
fabric-client = { path = "client", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "ingest", "retrieval", "graph", "reasoning", "provenance"]

[tool.pytest.ini_options]
pythonpath = ["client", "."]
