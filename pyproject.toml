[project]
name = "semantic-fabric"
version = "0.1.0"
description = "Enterprise semantic layer: ingestion, Context Graph, retrieval, reasoning, provenance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fabric-client",          # contract types (path dep in dev, see [tool.uv.sources])
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    # Phase 1 retrieval runs on pure-Python defaults (hashing embedder + in-memory
    # vector store + built-in BM25) — no extra deps. The production backends below
    # are optional and selected by config.
]

[project.optional-dependencies]
# Pinned <2: mcp 2.x renamed FastMCP -> MCPServer and changed APIs; the servers here
# (api/mcp_server.py and fabric_mcp/) target the v1 FastMCP surface.
mcp = ["mcp>=1.0,<2"]
# Production retrieval backends (Qdrant vector store + BGE-M3 embeddings).
prod = ["qdrant-client>=1.9", "FlagEmbedding>=1.2"]
# Semantic layers adopted per ADR 0001 (provenance / reasoning / ontology).
# Pinned per the evaluation spike; 0.x churn + bus-factor make drift a real risk.
semantica = ["semantica==0.6.8"]
# LLM-backed extraction (typed entities/relations) AND vision figure captioning.
# Provider-agnostic via LiteLLM (Anthropic / OpenAI / Ollama / proxy, chosen by
# EXTRACTION_MODEL / CAPTION_MODEL).
llm = ["litellm>=1.40"]
# Real dense-PDF layout parsing (per-page text, tables, embedded figures).
pdf = ["PyMuPDF>=1.24"]
# Persistent, SPARQL-native RDF graph store (Oxigraph, GRAPH_STORE=rdf). rdflib gives
# the rdflib.Graph snapshot semantica's reasoners consume.
graph = ["pyoxigraph>=0.5", "rdflib>=7.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.uv.sources]
fabric-client = { path = "client", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "ingest", "retrieval", "graph", "kb", "reasoning", "provenance", "ontology", "extraction", "fabric_mcp"]

[tool.pytest.ini_options]
pythonpath = ["client", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# These embed HTML/CSS content as string literals; long lines there are intentional.
"demo/run_demo.py" = ["E501"]
"scripts/build_guide.py" = ["E501"]
